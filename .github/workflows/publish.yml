name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if lookup=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm, nothing to release"
            unpublished=false
          elif grep -q E404 <<< "$lookup"; then
            unpublished=true
          else
            echo "$lookup"
            echo "::error::could not tell whether $name@$version is on npm"
            exit 1
          fi
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NAME: ${{ needs.check.outputs.name }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: echo "TARBALL=$RUNNER_TEMP/$NAME-$VERSION.tgz" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # pnpm pack applies publishConfig; npm publish then ships that same tarball as-is, with OIDC provenance.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm test:pack "$TARBALL"
      - name: Publish (prereleases go to the next tag, never latest)
        run: |
          case "$VERSION" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          npm publish "$TARBALL" --provenance --access public --tag "$dist_tag"

  # Its own job, so that no dependency code ever runs with a token that can push.
  tag:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
