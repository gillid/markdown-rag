name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # pnpm pack applies publishConfig; npm publish then ships that same tarball as-is, with OIDC provenance.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm test:pack "$RUNNER_TEMP/markdown-rag-${GITHUB_REF_NAME#v}.tgz"
      - name: Publish (prereleases go to the next tag, never latest)
        run: |
          case "$GITHUB_REF_NAME" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          npm publish "$RUNNER_TEMP/markdown-rag-${GITHUB_REF_NAME#v}.tgz" --provenance --access public --tag "$dist_tag"
